packages:
  - agent-tools
  - apps/oak-curriculum-mcp-streamable-http
  - apps/oak-search-cli
  # Demo: Oak-styled web UI over the live search + content stack.
  # Registered so workspace:* deps resolve and turbo can build/type-check it.
  - demos/oak-curriculum-hub
  - packages/core/oak-eslint
  - packages/core/observability
  - packages/core/openapi-zod-client-adapter
  - packages/core/build-metadata
  - packages/core/env
  - packages/core/graph-core
  - packages/core/result
  - packages/core/safe-path
  - packages/core/type-helpers
  - packages/design/*
  - packages/libs/env-resolution
  - packages/libs/graph-ingest
  - packages/libs/graph-project
  - packages/libs/logger
  - packages/libs/posthog-node
  - packages/libs/sentry-node
  - packages/libs/search-contracts
  - packages/sdks/graph-corpus-sdk
  - packages/sdks/oak-curriculum-sdk
  - packages/sdks/oak-sdk-codegen
  - packages/sdks/oak-search-sdk
  # Research record imported (content only, no git history) from the private
  # web-app-deconstruction repo (ADR-215). Only its evidence package is a
  # workspace member, so OCE's turbo type-check/lint/test gate its TypeScript;
  # the record root keeps its original standalone harness and is not itself
  # registered (its package.json wraps a nested turbo).
  - research/web-app-deconstruction/packages/research-evidence

# Supply-chain hardening: refuse to install any package version younger than 24h
# (1440 min), so a freshly-published compromised release ages — giving the
# ecosystem time to detect and yank it — before it can enter the tree. pnpm's
# default is 0 (no floor); this line introduces the floor. Setting the key
# explicitly also auto-enables minimumReleaseAgeStrict, so a too-young version is
# refused (or prompts on an interactive TTY), not silently downgraded. Applies to
# all (incl. transitive) deps at resolution time; frozen-lockfile installs (CI)
# are unaffected. Allow-list a genuinely-needed young package via
# minimumReleaseAgeExclude.
minimumReleaseAge: 1440

allowBuilds:
  '@clerk/shared': true
  '@sentry/cli': true
  esbuild: true
  unrs-resolver: true
  core-js: true
  sharp: true
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: '10'
    eslint-plugin-import-x>eslint: '10'
    eslint-plugin-react>eslint: '10'
    eslint-plugin-react-hooks>eslint: '10'
overrides:
  # Pin @types/node to the Node 24 LTS line across the whole tree, including
  # transitive peers (vite/vitest pull @types/node@26 as an optional peer).
  # Matches engines.node 24.x and keeps every workspace — including those that
  # do not declare @types/node directly — compiling against Node 24 types.
  # This override IS the hold — lift it when the project moves Node majors
  # (docs/engineering/build-system.md §Dependency updates).
  '@types/node': '^24.13.3'
  axios: '>=1.15.1'
  # Security floor, raised 2026-07-25: DoS via unbounded expansion length
  # causing an out-of-memory abort (high; patched in 5.0.8). Advisory was
  # published while this sweep was in flight — the 5.0.5 floor already here was
  # for an earlier finding. Reaches the tree through glob/minimatch tooling
  # chains; no production reachability established, patched because the fix is
  # a one-line floor. Left unbounded: 5.x is the current line.
  brace-expansion: '>=5.0.8'
  csstype: '>=3.2.3'
  esbuild: '>=0.28.1'
  # Security floor: host confusion via a literal backslash in fast-uri's URI
  # parser (high; patched in 3.1.4). Reaches the tree only through SDK and dev
  # tooling chains. Bounded below 4 deliberately — 4.x is published, and an
  # open floor would silently adopt a major nobody asked for. Raise the bound
  # when a consumer actually needs fast-uri 4.
  fast-uri: '>=3.1.4 <4'
  file-type: '>=21.3.2'
  follow-redirects: '>=1.15.12'
  hono: '>=4.12.25'
  # Security floor: unauthenticated memory-leak DoS in the Hono Node adapter
  # (patched in 2.0.10). PRODUCTION-REACHABLE, unlike most entries here:
  # @modelcontextprotocol/sdk's StreamableHTTPServerTransport imports
  # getRequestListener from this package and constructs one per request, so it
  # sits on the hot path of every /mcp call even though no repo source imports
  # Hono. Bounded below 3 deliberately — the previous open '>=1.19.10' floor is
  # why 2.x was adopted at all (the SDK asks only for ^1.19.9), and the bound
  # stops the next major arriving unreviewed. Raise it when the SDK does.
  '@hono/node-server': '>=2.0.10 <3'
  'js-cookie': '>=3.0.7'
  js-yaml: '>=4.1.1 <5.0.0'
  # Security floor: quadratic-complexity ReDoS via the mailto: matcher in
  # linkify-it (high; patched in 5.0.2). Arrives transitively through markdown
  # tooling. Bounded below 6 for the same reason as fast-uri: 6.x exists and an
  # open floor would take it. Raise the bound when markdown-it moves.
  linkify-it: '>=5.0.2 <6'
  markdown-it: '>=14.1.2'
  picomatch: '>=4.0.4'
  # Security floor, raised 2026-07-25. Originally for next's nested postcss
  # 8.4.31 (GHSA-qx2v-qp2m-jg93, XSS via unescaped </style> in stringify
  # output; patched in 8.5.10); now also covers path traversal in previous
  # source-map auto-loading (high; patched in 8.5.18). Build-time surface only.
  # Left unbounded: 8.x is the current line, so there is no major to guard
  # against yet — add a bound if 9.x ships.
  postcss: '>=8.5.18'
  qs: '>=6.15.2'
  rollup: '>=4.59.0'
  # Security floor: sharp inherits libvips CVEs below 0.35.0 (high;
  # CVE-2026-33327 and siblings). Reached only through Next's image
  # optimiser, and next caps optionalDependencies.sharp at ^0.34.5 through
  # 16.2.11, so this floor deliberately exceeds the range Next itself tests
  # against — the image path is exercised on the bump to prove it. sharp is
  # 0.x, so a future 0.36 is a breaking line: re-verify the image path when
  # it arrives. Drop this floor once next's own range admits >=0.35.
  sharp: '>=0.35.0'
  sucrase: '>=3.35.1'
