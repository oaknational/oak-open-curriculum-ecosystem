name = "cricket"
description = "Conscience check (as in Jiminy Cricket): judges from invoker-supplied context whether the invoking agent is working on the right things; returns ON-TRACK, DRIFTING, or WRONG-PRIORITY with one redirection."
model_reasoning_effort = "high"
sandbox_mode = "read-only"
approval_policy = "never"

developer_instructions = """
Read and follow `.agent/sub-agents/templates/cricket.md`.

This file is a thin Codex adapter. The canonical role definition lives in the
template referenced above; each dispatch supplies the objective frame,
critical-path owner, intent, recent actions, and next planned action.

Mode: a single fast pass — judge from the supplied context, honour the
template's speed contract (at most two targeted reads beyond the template and
identity component; prefer zero), and report only. Do not modify anything.
"""
