version: 2
updates:
  # github-actions only. The npm ecosystem is deliberately absent: Dependabot
  # regenerates the whole pnpm lockfile per PR with its own resolver, which
  # imports transitives published in the preceding 24h and so trips the
  # `minimumReleaseAge: 1440` supply-chain floor at CI install — every
  # npm-ecosystem PR was therefore unmergeable and closed by hand, while
  # github-actions PRs merge cleanly because they never touch `pnpm-lock.yaml`.
  # Vulnerability ALERTS stay enabled (a repo setting, not configured here):
  # we want the warnings, just not the PRs. npm updates land through agent-run
  # sweeps instead, where pnpm's own resolver honours the age floor.
  # See docs/engineering/build-system.md §Dependency updates.
  #
  # `/` covers .github/workflows and a root action.yml. The composite actions
  # under .github/actions carry their own action.yml with pinned actions, so
  # they are listed too: `directories` accepts globs, and Dependabot reads the
  # action.yml of each directory it matches. The same actions are pinned in
  # both places, so `group-by: dependency-name` bumps each action everywhere
  # in one pull request, rather than one pull request per directory.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    groups:
      github-actions:
        patterns:
          - '*'
        group-by: dependency-name
    schedule:
      interval: weekly
