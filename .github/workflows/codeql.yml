# CodeQL advanced setup — replaces the repository's default setup so the
# MCP-137 preservation tier can be path-excluded (see
# .github/codeql/codeql-config.yml for the why).
#
# SWITCH-OVER (owner-executed at merge): GitHub rejects advanced-setup
# analyses while default setup is enabled. At or immediately before
# merging this PR: Settings -> Code security -> CodeQL analysis ->
# switch default setup OFF. Then verify the branch ruleset's required
# check names still match what this workflow produces (the per-language
# "Analyze (<language>)" check runs and the "CodeQL" code-scanning
# results check on PRs).
#
# Coverage replicates the default setup it replaces (read from the
# default-setup API on 2026-07-24): languages actions,
# javascript-typescript, python; extended query suite; weekly schedule.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
