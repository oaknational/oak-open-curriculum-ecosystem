name: Release

# semantic-release runs after the CI workflow finishes on main. It is chained
# via `workflow_run` (not `push`) so a release only happens once CI has reported
# a conclusion, and the `if:` guard below restricts it to CI *successes*. If CI
# is ever renamed or split into multiple workflows, keep a workflow named "CI"
# (or update `workflows:` here) or releases will stop triggering.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Global, single-slot group: serialises all releases and never cancels one
# mid-flight (a half-published release is worse than a delayed one). This is the
# one place a cross-cutting concurrency group is appropriate — PR-check
# workflows instead use per-ref groups so they run in parallel.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only release when the upstream CI run succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      # A GitHub App token (not the default GITHUB_TOKEN) so the version-bump
      # commit and tag semantic-release pushes can trigger downstream workflows
      # and carry the write scope releases need. checkout uses this token with
      # persist-credentials: false so it is not written to the runner's git config.
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: 0

  # A release that fails must fail LOUDLY: the 2026-07-23 incident showed the
  # silent alternative — semantic-release rejected on push, no version bump,
  # the Vercel ignore-gate then cancelling every production build while main
  # advanced. This job posts to Slack whenever the release job fails, so a
  # broken release leg is a notification, never an archaeology exercise.
  # Activation needs owner-side setup (bot token scope chat:write, app invited
  # to the channel, SLACK_BOT_TOKEN repo secret); until then the job fails
  # visibly in the run summary without affecting the release itself.
  notify-failure:
    name: Alert release failure
    needs: [release]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    # No checkout and no GITHUB_TOKEN use — drop all default permissions.
    permissions: {}
    steps:
      - name: Send Slack failure alert
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          # The action swallows API/auth errors by default; errors: true makes
          # a failed alert fail the step — an alert that cannot send must never
          # be green (the silent-composition class this job exists to kill).
          errors: true
          payload: |
            channel: C0BKEUM2UAG
            text: ":rotating_light: Release workflow failed on main — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view the run>. Production does not advance until the release leg is cured (see .agent/plans/runbooks/release-process.plan.md)."
