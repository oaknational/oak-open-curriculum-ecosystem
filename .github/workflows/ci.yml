name: CI

# Quality-gate pipeline for PRs targeting main or engraph, and pushes to
# either branch. Parallel jobs let each gate report independently, while superseded PR runs
# cancel. A final `run-quality-gates` fan-in job is the single required status
# check: it fails unless EVERY gate succeeded (so a failed, cancelled, or skipped
# gate all block), so the branch ruleset and the Release workflow's
# `workflow_run: [CI]` trigger need no change while every split job is blocking.
#
# Caching strategy (avoids a cold-cache network stampede): the `install` job
# performs the one network install on a changed lockfile and populates the pnpm
# store cache; every downstream job then restores that cache and installs
# offline. The `build` job warms the Turbo remote cache once; build-dependent
# jobs hit it instead of rebuilding. Playwright browsers and the gitleaks binary
# are version-pinned. Job dependency tiers:
#   secret-scan        — no pnpm install (gitleaks binary); runs from t=0 in parallel
#   install            — warms the pnpm store cache
#     static-checks    — needs install (no build): format, markdown, shell, validators
#     build            — needs install: warms the Turbo remote cache
#       unit-tests     — needs build: type-check, lint, unit tests
#       knip-depcruise — needs build: unused-code + dependency-direction checks
#       browser-tests  — needs build: e2e, ui, a11y, widget suites (Playwright)

on:
  push:
    branches: [main, engraph]
  pull_request:
    branches: [main, engraph]
  # Inert: no merge queue is configured (ADR-204), so GitHub never dispatches a
  # `merge_group` event and this trigger is a no-op. Kept as zero-cost readiness
  # should a merge queue ever be reconsidered; do not rely on it to gate.
  merge_group:

# Cancel superseded runs for the same PR ref. Push runs on both long-lived
# branches are never cancelled: each commit must stay verified. Only main feeds
# the Release workflow because that workflow filters its workflow_run to main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permissions are declared per job (least privilege; Sonar githubactions:S8264):
# the checkout jobs get `contents: read`, the aggregator needs none.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Branch + tag secret scan. Independent of Node/pnpm, so it runs from t=0 in
  # parallel with `install` and everything downstream. Uses a version- and
  # checksum-pinned gitleaks binary (replacing a per-run docker pull) to match
  # the local pre-push hook and keep the scan fast. pnpm/Node are set up only to
  # run the `pnpm secrets:scan` script (a plain gitleaks call); `pnpm install` is
  # intentionally omitted because the scan needs no node_modules.
  secret-scan:
    name: secret-scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans --branches --tags; needs full history

      - name: Install pinned gitleaks
        run: |
          version=8.30.0
          asset="gitleaks_${version}_linux_x64.tar.gz"
          # SHA-256 of the v8.30.0 linux_x64 asset, pinned inline so integrity is
          # not verified against the same channel the bytes came from. gitleaks is
          # a security control, so its binary is content-pinned, not just version-pinned.
          expected=79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          curl -sSfL --proto '=https' --proto-redir '=https' -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}"
          echo "${expected}  ${asset}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "$asset" gitleaks
          gitleaks version

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Scan for secrets
        run: pnpm secrets:scan

  # Cold-cache install gate: performs the one network install on a changed
  # lockfile and saves the pnpm store cache, so the jobs that depend on it
  # install offline.
  install:
    name: install
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

  # Static analysis that needs node_modules but not a build. Runs in parallel
  # with `build`.
  static-checks:
    name: static-checks
    permissions:
      contents: read
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: pnpm format-check:root
      - name: Check markdown
        run: pnpm markdownlint-check:root
      - name: Lint runtime-only scripts
        run: pnpm lint:runtime-only
      - name: Lint shell scripts
        run: pnpm lint:shell
      - name: Validate sub-agents
        run: pnpm subagents:check
      - name: Validate portability
        run: pnpm portability:check
      - name: Run workspace-owned repo validators
        run: pnpm repo-validators:check
      # Both legs self-build agent-tools, so they run here without the
      # build job. Until AIP-165, skills:check ran only in `pnpm check`
      # and encoding:check only there and at pre-push — neither was
      # CI-gated, which is how adapter drift merged CI-green.
      - name: Validate skills adapters
        run: pnpm skills:check
      - name: Validate encoding
        run: pnpm encoding:check

  # Warms the Turbo remote cache (sdk-codegen + build) so the build-dependent
  # jobs below get a FULL TURBO cache hit instead of rebuilding.
  build:
    name: build
    permissions:
      contents: read
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build (sdk-codegen + build)
        run: pnpm exec turbo run sdk-codegen build --continue --log-order=grouped --summarize
      - name: Report Turbo summary
        if: always()
        run: pnpm --filter @oaknational/agent-tools ci-turbo-report >> "$GITHUB_STEP_SUMMARY"
      - name: Check schema cache drift (advisory)
        if: always()
        run: pnpm --filter @oaknational/agent-tools ci-schema-drift-check

  # Type-check, ESLint, and unit tests. Turbo restores the build outputs from
  # the remote cache warmed by `build`.
  unit-tests:
    name: unit-tests
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Type-check, lint, unit tests
        run: pnpm exec turbo run type-check lint test --continue --log-order=grouped --summarize
      - name: Report Turbo summary
        if: always()
        run: pnpm --filter @oaknational/agent-tools ci-turbo-report >> "$GITHUB_STEP_SUMMARY"

  # Unused-code (knip) and dependency-direction (depcruise) checks. Both resolve
  # through built dist/ outputs, so restore the build from the Turbo cache first.
  knip-depcruise:
    name: knip-depcruise
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Restore build outputs
        run: pnpm exec turbo run sdk-codegen build --continue --log-order=grouped
      - name: Run knip gate (unused code detection; crash-as-pass guarded)
        run: pnpm knip:gate
      - name: Run depcruise (circular deps, orphans, layer violations)
        run: pnpm depcruise

  # Browser-based suites (chromium only, network-free per ADR-161). The
  # Playwright browser download is cached, keyed on the Playwright version; a
  # cache hit means `playwright install` only ensures OS deps, skipping the
  # browser download.
  browser-tests:
    name: browser-tests
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Key on the Playwright version, not the lockfile hash: the browser cache
          # only needs to rotate when the browser version changes. No restore-keys,
          # so a version bump misses cleanly and downloads only the new browser. A
          # restore-keys fallback would carry old chromium builds forward (Playwright
          # install never prunes them) and bloat the cache, eventually evicting the
          # pnpm/Turbo caches under GitHub's per-repo quota.
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright (browser + OS deps)
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser suites (e2e, ui, a11y, widget)
        run: >-
          pnpm exec turbo run test:e2e test:ui test:a11y test:widget
          test:widget:ui test:widget:a11y --continue --log-order=grouped --summarize
      - name: Report Turbo summary
        if: always()
        run: pnpm --filter @oaknational/agent-tools ci-turbo-report >> "$GITHUB_STEP_SUMMARY"

  # Single required status check: fans in every gate above and fails unless every
  # one succeeded — failed, cancelled, AND skipped results all block (fail-closed,
  # so adding an `if:` guard to a gate later cannot silently bypass it). Reusing
  # the existing `run-quality-gates` context keeps the branch ruleset unchanged
  # while each split job blocks merge.
  run-quality-gates:
    name: run-quality-gates
    permissions: {}
    needs:
      - secret-scan
      - install
      - static-checks
      - build
      - unit-tests
      - knip-depcruise
      - browser-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Require EVERY gate result to be `success`. This is fail-closed: failure,
      # cancelled, and skipped all block, and any future GitHub result value is
      # treated as non-passing without another edit. The expression is read via an
      # env var so no `${{ }}` value is interpolated into the shell.
      - name: Verify every quality gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Gate results: $RESULTS"
          IFS=',' read -ra results <<< "$RESULTS"
          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              echo "::error::Quality gate result '$result' is not 'success' — blocking merge."
              exit 1
            fi
          done
          echo "All quality gates passed."
