name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  run-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run secret scan
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            pnpm secrets:scan
          else
            echo "Warning: gitleaks not on PATH, using docker fallback."
            docker run --rm \
              -v "${{ github.workspace }}:/src" \
              -w /src \
              zricethezav/gitleaks:v8.30.0 \
              detect --redact=100 --source /src --config /src/.gitleaks.toml --log-opts="--branches --tags"
          fi

      # Non-Turbo checks (run before Turbo gates)
      - name: Check formatting
        run: pnpm format-check:root

      - name: Check markdown
        run: pnpm markdownlint-check:root

      - name: Validate sub-agents
        run: pnpm subagents:check

      - name: Validate portability
        run: pnpm portability:check

      - name: Run workspace-owned repo validators
        run: pnpm repo-validators:check

      - name: Lint shell scripts
        run: pnpm lint:shell

      - name: Install Playwright browsers (test:ui, test:a11y, widget suites)
        run: pnpm exec playwright install --with-deps chromium

      # Single Turbo invocation for all Turbo-managed gates. Includes the widget
      # and accessibility (WCAG 2.2 AA) suites so a11y regressions are gated in
      # CI, not only locally. All are chromium-only and network-free (ADR-161);
      # Turbo resolves the dependsOn ordering (e.g. test:a11y after test:ui).
      - name: Build, type-check, lint, test
        id: turbo-run
        run: >-
          pnpm exec turbo run sdk-codegen build type-check lint test test:widget
          test:e2e test:ui test:widget:ui test:a11y test:widget:a11y
          --summarize --log-order=grouped --continue

      # Run after build (knip + depcruise both resolve through built dist/ outputs)
      - name: Run knip (unused code detection)
        run: pnpm knip

      - name: Run depcruise (circular deps, orphans, layer violations)
        run: pnpm depcruise

      - name: Report Turbo summary
        if: always()
        run: pnpm --filter @oaknational/agent-tools ci-turbo-report >> "$GITHUB_STEP_SUMMARY"

      - name: Check schema cache drift (advisory)
        if: always()
        run: pnpm --filter @oaknational/agent-tools ci-schema-drift-check
