name: Setup pnpm + Node
description: >-
  Install pnpm, set up Node 24 with pnpm-store caching, and install workspace
  dependencies. Run this AFTER actions/checkout. The first CI job to run
  (`install`) populates the pnpm store cache on a cold key; every later job that
  depends on it restores that cache and installs offline, so a changed lockfile
  triggers exactly one network install per run instead of one per job.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
