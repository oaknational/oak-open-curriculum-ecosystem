# SonarQube Cloud automatic analysis configuration.
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis#additional-analysis-configuration
#
# This repo uses SonarCloud automatic analysis, which reads ONLY this file —
# there is deliberately no sonar-project.properties. Per-issue dispositions
# (FALSE_POSITIVE / SAFE) are made server-side in SonarCloud, never via
# file-based rule-ignore config (per-rule glob disables are forbidden — see
# docs/governance/sonar-disposition-policy.md).
#
# Agent tooling source remains in the CPD corpus. Only generated artefacts,
# tests, package-local config shapes, external-source data snapshots (the
# `*.external-data.ts` convention), and curated naming-schema wordlist data
# (ADR-198; owner-authorised 2026-06-11, PR #189) are excluded.
# The vocab-gen generated artefacts (mined synonyms, graph datasets) are
# machine-generated data whose entries are inherently repetitive; duplication
# detection is excluded for them alone — full analysis still applies
# (owner-authorised 2026-07-27, PR #588).
# The current-source delta-review ledgers are reviewer-maintained compliance
# tables: hundreds of deliberately uniform reviewed()/excluded() rows whose
# per-row inspectability in a diff IS the design. Duplication detection is
# excluded for the ledger part files alone — full analysis still applies,
# and the module's logic and anchor-override tables stay in the CPD corpus
# (owner-authorised 2026-07-28, PR #582).
# The design-review calibration fixtures are deliberately degraded COPIES of
# the export's own pages — each fixture IS its source page with a scoped
# mutation, so their duplication is constitutive of the artefact class (a
# generator cure would destroy what the corpus is for). They are
# non-production calibration source material fenced in their own directory;
# duplication detection is excluded for that directory alone — full analysis
# still applies (owner-authorised 2026-08-09, PR #831).
# The oak-theme.js runtime copy-set is ONE generated artefact (tsc
# type-erasure emit of packages/design/oak-design-system/src/oak-theme.ts)
# committed byte-identically at its three serving locations, with parity
# gated by the workspace test suite (tools/validate-kit-assets.ts). The
# duplication the CPD measure reports between the copies is the copy-set
# architecture itself, not authored duplication — a cure would mean deleting
# a served file. Duplication detection is excluded for the three generated
# copies alone; the TypeScript source stays in the CPD corpus and full
# analysis still applies to every copy (owner-directed merge path,
# 2026-08-13, PR #846).
sonar.cpd.exclusions=**/src/types/generated/**,**/*.test.ts,**/*.test.tsx,**/tests/**,**/e2e-tests/**,**/*.config.*,packages/sdks/oak-sdk-codegen/src/types/generated/api-schema/**,**/*.external-data.ts,agent-tools/src/core/agent-identity/schemas/**,packages/design/oak-design-system/studio-source/**,packages/sdks/oak-sdk-codegen/src/generated/vocab/**,agent-tools/src/mcp-content-current-source/current-source-delta-reviews-*.ts,docs/design/design-review/records/calibration-v0-fixtures/**,packages/design/oak-design-system/oak-theme.js,demos/oak-design-showcase/public/oak-theme.js,demos/oak-curriculum-hub/public/oak-theme.js

# Design-system studio-source scope (ADR-213; AIP-137 PR2; owner-ruled
# 2026-07-19). Owner ruling, verbatim: "Product code gets no sonar exclusions
# for any reason (including generated product code), no quality gate
# exceptions, nothing, it all gets the full set of strict, strict
# requirements" — exclusions are legitimate IF AND ONLY IF the material is
# not used as production code AND is organised and kept explicitly as source
# material from Claude Design. That boundary is now STRUCTURAL:
# packages/design/oak-design-system/studio-source/ holds exactly the
# non-production studio material (specimens, proofs, reference build,
# templates, reference components, vendored reveal.js, proof pages — see its
# README), and the exclusion binds that path alone. The entire consumable
# surface (root token CSS, class library, print layer, brand.css override
# contract, oak-icons.css, oak-theme.js, dtcg, assets, docs) is fully
# analysed under the standard gate, duplication metric included; its findings
# resolve per-site under the disposition policy, never by scope.
sonar.exclusions=packages/design/oak-design-system/studio-source/**

# Path to sources
# sonar.sources=
# sonar.inclusions=

# Path to tests
# sonar.tests=
# sonar.test.exclusions=
# sonar.test.inclusions=

# Source encoding
sonar.sourceEncoding=UTF-8

# Exclusions for copy-paste detection
# sonar.cpd.exclusions=

# Python version (for python projects only)
# sonar.python.version=

# C++ standard version (for C++ projects only)
# If not specified, it defaults to the latest supported standard
# sonar.cfamily.reportingCppStandardOverride=c++98|c++11|c++14|c++17|c++20
