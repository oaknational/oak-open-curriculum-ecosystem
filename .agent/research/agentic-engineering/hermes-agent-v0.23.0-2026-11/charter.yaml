hermes_stated_design:
  source_note: >-
    Quoted from the root AGENTS.md and the developer guide at the pinned commit
    2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19. The full set, with permalinks, is section 1 of
    architecture-map.md. Both sources come from the same maintainers.
  what_hermes_is: >-
    "Hermes is a personal AI agent that runs the same agent core across a CLI, a messaging
    gateway (Telegram, Discord, Slack, ~20 platforms), a TUI, and an Electron desktop app. It
    learns across sessions (memory + skills), delegates to subagents, runs scheduled jobs, and
    drives a real terminal and browser. It is extended primarily through **plugins and skills**,
    not by growing the core." (AGENTS.md L12-L16)
  invariants:
    - >-
      "**Per-conversation prompt caching is sacred.** Mutating past context, swapping toolsets,
      reloading memories or rebuilding the system prompt mid-conversation breaks the cached
      prefix and multiplies the user's cost; the ONE exception is context compression."
      (AGENTS.md L20-L22)
    - >-
      "**The core is a narrow waist; capability lives at the edges.**" (AGENTS.md L24)
  design_principles:
    - "Prompt stability"
    - "Observable execution"
    - "Interruptible"
    - "Platform-agnostic core"
    - "Loose coupling"
    - "Profile isolation"
  design_principles_source: "website/docs/developer-guide/architecture.md L260-L269"
  qa_frame_verdict: >-
    QA-F1 holds for the decomposition and the request path. QA-F2 holds for the documented
    counts and for the tool dependency chain as drawn. Detail: architecture-map.md, A6.
depth_verdicts:
