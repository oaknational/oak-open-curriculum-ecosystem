<!DOCTYPE html>
<!-- @dsCard group="Components" name="Hint" subtitle="Hint button + revealed hint bubble" viewport="700x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--bg-primary); font-family:var(--font-sans); display:flex; flex-direction:column; gap:18px; align-items:flex-start; max-width:560px; }
  .hint-btn { display:inline-flex; align-items:center; gap:10px; padding:12px 18px; border:2px solid var(--border-primary); border-radius:100px;
    background:var(--bg-primary); cursor:pointer; font:700 16px/20px var(--font-sans); letter-spacing:-0.005rem; color:var(--text-primary); box-shadow:var(--shadow-lemon); }
  .hint-btn img { width:24px; height:24px; }
  .bubble { position:relative; background:var(--oak-lemon30); border:2px solid var(--border-primary); border-radius:12px; padding:18px 20px;
    font:300 16px/24px var(--font-sans); letter-spacing:-0.005rem; color:var(--text-primary); box-shadow:4px 4px 0 var(--oak-black); }
  .bubble::before { content:""; position:absolute; top:-9px; left:28px; width:16px; height:16px; background:var(--oak-lemon30); border-left:2px solid var(--border-primary); border-top:2px solid var(--border-primary); transform:rotate(45deg); }
  .bubble b { font-weight:700; }
</style></head>
<body>
  <button class="hint-btn"><img src="../assets/icons/lightbulb.svg" alt="">Need a hint?</button>
  <div class="bubble"><b>Hint:</b> Think about what happens to water vapour when it cools down high in the atmosphere.</div>
</body></html>
