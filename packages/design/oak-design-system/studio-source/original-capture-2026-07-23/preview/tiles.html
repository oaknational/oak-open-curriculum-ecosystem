<!DOCTYPE html>
<!-- @dsCard group="Components" name="Selection tiles" subtitle="Radio, checkbox & icon tiles — selected vs default" viewport="760x260" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--bg-primary); font-family:var(--font-sans); display:flex; flex-direction:column; gap:18px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .lbl { font:700 11px/14px var(--font-sans); letter-spacing:0.02em; text-transform:uppercase; color:var(--text-subdued); width:100%; }
  .tile { display:flex; align-items:center; gap:12px; padding:16px 18px; border:2px solid var(--border-primary); border-radius:8px;
    background:var(--bg-primary); cursor:pointer; font:700 16px/20px var(--font-sans); letter-spacing:-0.005rem; color:var(--text-primary); box-shadow:var(--shadow-lemon); }
  .tile.sel { background:var(--oak-lemon30); box-shadow:4px 4px 0 var(--oak-black); }
  .radio { width:24px; height:24px; border:2px solid var(--border-primary); border-radius:100px; flex:0 0 24px; position:relative; background:var(--bg-primary); }
  .sel .radio.on::after { content:""; position:absolute; inset:4px; border-radius:100px; background:var(--bg-inverted); }
  .box { width:24px; height:24px; border:2px solid var(--border-primary); border-radius:4px; flex:0 0 24px; display:inline-flex; align-items:center; justify-content:center; background:var(--bg-primary); }
  .box.on { background:var(--bg-inverted); } .box.on img { width:16px; height:16px; filter:invert(1); }
  .icon-tile { flex-direction:column; align-items:center; gap:10px; width:120px; text-align:center; padding:18px 14px; }
  .chip { width:48px; height:48px; border-radius:100px; border:2px solid var(--border-primary); display:flex; align-items:center; justify-content:center; background:var(--oak-aqua); }
  .chip img { width:30px; height:30px; }
</style></head>
<body>
  <div class="row">
    <span class="lbl">Radio tile</span>
    <label class="tile sel"><span class="radio on"></span> Key stage 3</label>
    <label class="tile"><span class="radio"></span> Key stage 4</label>
  </div>
  <div class="row">
    <span class="lbl">Checkbox tile</span>
    <label class="tile sel"><span class="box on"><img src="../assets/icons/tick.svg" alt=""></span> Include quizzes</label>
    <label class="tile"><span class="box"></span> Include worksheet</label>
  </div>
  <div class="row">
    <span class="lbl">Icon tile</span>
    <label class="tile icon-tile sel"><span class="chip"><img src="../assets/icons/subject-science.svg" alt=""></span> Science</label>
    <label class="tile icon-tile"><span class="chip" style="background:var(--oak-pink)"><img src="../assets/icons/subject-history.svg" alt=""></span> History</label>
  </div>
</body></html>
