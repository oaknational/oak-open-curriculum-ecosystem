<!DOCTYPE html>
<!-- @dsCard group="Components" name="Signature interaction" subtitle="Rest → hover (wider shadow) → pressed (translate+collapse)" viewport="700x160" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:22px 18px; background:var(--bg-primary); font-family:var(--font-sans);
    display:grid; grid-template-columns: repeat(5, auto); gap:18px 22px;
    justify-content:center; align-items:end; }
  .col { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .btn {
    height:48px; min-width:149px; box-sizing:border-box;
    display:inline-flex; align-items:center; justify-content:center;
    padding:12px 16px; gap:8px; border-radius:4px;
    font:600 16px/20px var(--font-sans); letter-spacing:0.0115rem;
    background:var(--bg-inverted); color:var(--oak-white); border:2px solid var(--border-primary);
  }
  /* Matches OakPrimaryButton (InternalShadowRectButton) states: */
  .btn.default { /* no shadow */ }
  .btn.hover   { background:var(--oak-grey60); border-color:var(--text-subdued); box-shadow:var(--shadow-lemon); }
  .btn.hover span { text-decoration: underline; }
  .btn.focus   { box-shadow: var(--focus-ring); }
  .btn.pressed { box-shadow: var(--shadow-press); }
  .btn.disabled{ background:var(--oak-grey50); border-color:var(--oak-grey50); color:var(--oak-white); }

  .cap { font:700 11px/14px var(--font-sans); letter-spacing:0.02em;
         color:var(--text-subdued); text-transform:uppercase; }
  .note { grid-column: 1 / -1; margin-top:8px;
          font:300 13px/18px var(--font-sans); color:var(--text-subdued); text-align:center; max-width:780px; }
</style></head>
<body>
  <div class="col"><button class="btn default"><span>Button</span></button><span class="cap">default</span></div>
  <div class="col"><button class="btn hover"><span>Button</span></button><span class="cap">hover</span></div>
  <div class="col"><button class="btn focus"><span>Button</span></button><span class="cap">focus</span></div>
  <div class="col"><button class="btn pressed"><span>Button</span></button><span class="cap">pressed</span></div>
  <div class="col"><button class="btn disabled"><span>Button</span></button><span class="cap">disabled</span></div>
  <p class="note">Hover = grey60 fill + 2 px lemon drop-shadow + underline · Focus = 2 px lemon + ~5 px grey60 ring · Pressed = 4 px grey60 drop shadow with 2 px lemon offset.</p>
</body></html>
