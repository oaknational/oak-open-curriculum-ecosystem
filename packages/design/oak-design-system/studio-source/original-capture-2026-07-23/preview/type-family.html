<!DOCTYPE html>
<!-- @dsCard group="Type" name="Lexend weights" subtitle="Primary typeface, 300–900" viewport="700x160" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:22px 24px; background:var(--bg-primary); font-family:var(--font-sans); }
  .wrap { display:flex; gap:20px; align-items:flex-end; }
  .w { text-align:center; }
  .specimen { font-family:var(--font-sans); font-size:56px; line-height:1; color:var(--text-primary); letter-spacing:0.0115rem; }
  .label { margin-top:8px; font:400 11px/14px var(--font-mono); color:var(--text-subdued); }
</style></head>
<body>
  <div class="wrap">
    <div class="w"><div class="specimen" style="font-weight:300;">Aa</div><div class="label">300 · light</div></div>
    <div class="w"><div class="specimen" style="font-weight:400;">Aa</div><div class="label">400 · regular</div></div>
    <div class="w"><div class="specimen" style="font-weight:600;">Aa</div><div class="label">600 · semibold</div></div>
    <div class="w"><div class="specimen" style="font-weight:700;">Aa</div><div class="label">700 · bold</div></div>
    <div class="w"><div class="specimen" style="font-weight:900;">Aa</div><div class="label">900 · black</div></div>
    <div style="flex:1; text-align:right; padding-bottom:6px;">
      <div style="font:700 22px/24px var(--font-sans); letter-spacing:-0.005rem;">Lexend</div>
      <div style="font:300 14px/18px var(--font-sans); color:var(--text-subdued); max-width:200px; margin-left:auto;">Primary typeface. Loaded from Google Fonts.</div>
    </div>
  </div>
</body></html>
