<!DOCTYPE html>
<!-- @dsCard group="Components" name="Select / dropdown" subtitle="Closed select + open menu with selected item" viewport="700x320" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--bg-primary); font-family:var(--font-sans); display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
  .field { display:flex; flex-direction:column; gap:6px; min-width:260px; }
  label { font:700 13px/16px var(--font-sans); letter-spacing:-0.005rem; }
  .select { display:flex; align-items:center; justify-content:space-between; gap:12px;
    height:56px; padding:0 16px; border:2px solid var(--border-primary); border-radius:4px; background:var(--bg-primary);
    font:300 18px/24px var(--font-sans); letter-spacing:-0.005rem; color:var(--text-primary); cursor:pointer; }
  .select img { width:24px; height:24px; }
  .menu { border:2px solid var(--border-primary); border-radius:4px; overflow:hidden; background:var(--bg-primary); box-shadow:var(--shadow-grey); }
  .opt { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px;
    font:300 18px/24px var(--font-sans); letter-spacing:-0.005rem; color:var(--text-primary); cursor:pointer; border-bottom:1px solid var(--oak-grey30); }
  .opt:last-child { border-bottom:0; }
  .opt.sel { background:var(--oak-lemon30); font-weight:700; }
  .opt.hov { background:var(--oak-grey20); }
  .opt img { width:20px; height:20px; }
</style></head>
<body>
  <div class="field">
    <label>Key stage</label>
    <div class="select"><span>Key stage 3</span><img src="../assets/icons/chevron-down.svg" alt=""></div>
  </div>
  <div class="field">
    <label>Year group</label>
    <div class="menu">
      <div class="opt">Year 7</div>
      <div class="opt sel">Year 8 <img src="../assets/icons/tick.svg" alt=""></div>
      <div class="opt hov">Year 9</div>
      <div class="opt">Year 10</div>
    </div>
  </div>
</body></html>
