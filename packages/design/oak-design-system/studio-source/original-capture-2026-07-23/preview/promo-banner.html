<!DOCTYPE html>
<!-- @dsCard group="Components" name="Promo banner & tag" subtitle="Top promo banner + jaunty promotional tags" viewport="760x280" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:0; background:var(--bg-primary); font-family:var(--font-sans); }
  .promo { background:var(--oak-lemon); border-bottom:2px solid var(--border-primary); padding:14px 24px; display:flex; align-items:center; justify-content:center; gap:14px; }
  .promo span { font:700 16px/22px var(--font-sans); letter-spacing:-0.005rem; color:var(--text-primary); }
  .promo a { display:inline-flex; align-items:center; gap:6px; font:700 16px/22px var(--font-sans); color:var(--text-primary); text-decoration:underline; text-underline-offset:2px; }
  .promo a img { width:20px; height:20px; }
  .body { padding:32px 24px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .tag { display:inline-block; background:var(--oak-purple); color:var(--oak-white); font:700 14px/18px var(--font-sans); letter-spacing:0.0115rem;
    padding:8px 14px; border:2px solid var(--border-primary); transform:rotate(-3deg); box-shadow:2px 2px 0 var(--oak-black); }
  .tag.lemon { background:var(--oak-lemon); color:var(--text-primary); transform:rotate(2deg); }
  .tag.mint { background:var(--oak-mint); color:var(--text-primary); transform:rotate(-2deg); }
  .tag.lg { font-size:18px; padding:10px 18px; }
</style></head>
<body>
  <div class="promo">
    <span>✶ New AI tools are here — free for every teacher.</span>
    <a href="#">Try Aila<img src="../assets/icons/arrow-right.svg" alt=""></a>
  </div>
  <div class="body">
    <span class="tag lg">New</span>
    <span class="tag lemon">Free forever</span>
    <span class="tag mint">Beta</span>
    <span class="tag">Limited time</span>
  </div>
</body></html>
