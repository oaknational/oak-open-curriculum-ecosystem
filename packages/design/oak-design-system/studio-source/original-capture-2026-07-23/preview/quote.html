<!DOCTYPE html>
<!-- @dsCard group="Components" name="Quote" subtitle="Pull-quote on a decorative panel" viewport="700x260" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--bg-primary); font-family:var(--font-sans); }
  .quote { background:var(--oak-aqua30); border:2px solid var(--border-primary); border-radius:16px; padding:32px 36px; box-shadow:6px 6px 0 var(--oak-black); max-width:620px; }
  .mark { font:700 64px/0.6 var(--font-sans); color:var(--oak-green); display:block; height:36px; }
  blockquote { margin:0 0 20px; font:400 24px/32px var(--font-sans); letter-spacing:0.0115rem; color:var(--text-primary); }
  .who { display:flex; align-items:center; gap:12px; }
  .av { width:44px; height:44px; border-radius:100px; background:var(--oak-mint); border:2px solid var(--border-primary); }
  .name { font:700 16px/20px var(--font-sans); letter-spacing:-0.005rem; color:var(--text-primary); }
  .role { font:300 14px/18px var(--font-sans); letter-spacing:-0.005rem; color:var(--text-subdued); }
</style></head>
<body>
  <figure class="quote" style="margin:0;">
    <span class="mark">“</span>
    <blockquote>Incorporating Aila into my teaching has the potential to save me around 30 minutes per lesson — and enhance their quality too.</blockquote>
    <figcaption class="who">
      <span class="av"></span>
      <span><span class="name">James</span><br><span class="role">Teacher, St Cuthbert Mayne School</span></span>
    </figcaption>
  </figure>
</body></html>
