<!DOCTYPE html>
<!-- @dsCard group="Components" name="Modal" subtitle="Centred dialog over a dimmed overlay" viewport="760x420" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:0; font-family:var(--font-sans); }
  .overlay { min-height:420px; background:rgba(34,34,34,0.25); display:flex; align-items:center; justify-content:center; padding:24px; }
  .modal { position:relative; width:460px; max-width:100%; background:var(--bg-primary); border:3px solid var(--border-primary); border-radius:16px;
    padding:32px; box-shadow:8px 8px 0 var(--oak-black); }
  .close { position:absolute; top:16px; right:16px; width:36px; height:36px; border:2px solid var(--border-primary); border-radius:100px;
    background:var(--bg-primary); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .close img { width:18px; height:18px; }
  .modal h2 { margin:0 0 12px; font:600 28px/34px var(--font-sans); letter-spacing:0.0115rem; color:var(--text-primary); }
  .modal p { margin:0 0 24px; font:300 18px/26px var(--font-sans); letter-spacing:-0.005rem; color:var(--text-primary); }
  .actions { display:flex; gap:12px; justify-content:flex-end; }
  .btn { font:700 16px/20px var(--font-sans); letter-spacing:-0.010em; padding:12px 16px; border-radius:4px; cursor:pointer; }
  .primary { background:var(--bg-inverted); color:var(--oak-white); border:2px solid var(--border-primary); box-shadow:var(--shadow-lemon); }
  .secondary { background:var(--bg-primary); color:var(--text-primary); border:2px solid var(--border-primary); }
</style></head>
<body>
  <div class="overlay">
    <div class="modal">
      <button class="close"><img src="../assets/icons/cross.svg" alt=""></button>
      <h2>Send to your pupils?</h2>
      <p>This will share the video, worksheet and exit quiz with your class to complete at home.</p>
      <div class="actions">
        <button class="btn secondary">Cancel</button>
        <button class="btn primary">Send now</button>
      </div>
    </div>
  </div>
</body></html>
