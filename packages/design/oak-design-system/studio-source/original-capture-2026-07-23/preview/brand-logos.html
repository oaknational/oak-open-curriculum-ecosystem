<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logos" subtitle="Primary wordmark, acorn mark, on-dark treatment" viewport="700x160" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px 24px; background:var(--bg-primary); font-family:var(--font-sans); display:flex; align-items:center; gap:36px; justify-content:center; }
  .item { text-align:center; }
  .item img { display:block; height:60px; margin:0 auto; }
  .lbl { margin-top:14px; font:700 12px/16px var(--font-sans); }
  .desc { font:300 11px/14px var(--font-sans); color:var(--text-subdued); }
</style></head>
<body>
  <div class="item">
    <img src="../assets/logo-full-official.svg" alt="Oak National Academy logo">
    <div class="lbl">Primary wordmark</div>
    <div class="desc">logo-full-official.svg</div>
  </div>
  <div class="item">
    <img src="../assets/logo-acorn-official.svg" alt="Oak acorn mark">
    <div class="lbl">Acorn mark</div>
    <div class="desc">logo-acorn-official.svg</div>
  </div>
  <div class="item" style="padding:10px 18px; background:var(--bg-inverted); border-radius:8px;">
    <img src="../assets/logo-full-official.svg" style="filter:invert(1) brightness(2);" alt="Oak logo on dark">
    <div class="lbl" style="color:var(--oak-white); margin-top:10px;">On dark</div>
    <div class="desc" style="color:var(--oak-grey40);">Invert for contrast</div>
  </div>
</body></html>
