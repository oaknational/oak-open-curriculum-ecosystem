<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Decorative palette" subtitle="6 pastel families × 4 tints each" viewport="700x360" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:var(--bg-primary); font-family:var(--font-sans); }
  h4 { font:700 12px/16px var(--font-sans); margin:0 0 8px; letter-spacing:-0.005rem; text-transform:uppercase; color:var(--text-subdued); }
  .group { display:flex; gap:8px; margin-bottom:14px; }
  .sw { flex:1; border:2px solid var(--border-primary); border-radius:8px; overflow:hidden; }
  .chip { height:48px; }
  .label { padding:6px 8px; background:var(--bg-primary); border-top:2px solid var(--border-primary); font:400 10px/13px var(--font-mono); color:var(--text-primary); }
  .row { display:flex; gap:6px; align-items:center; }
  .name { font:700 14px/18px var(--font-sans); width:92px; }
</style></head>
<body>
  <div class="row" style="margin-bottom:10px;">
    <div class="name">mint</div>
    <div class="group" style="margin:0; flex:1;">
      <div class="sw"><div class="chip" style="background:var(--oak-mint30)"></div><div class="label">mint30</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-mint50)"></div><div class="label">mint50</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-mint)"></div><div class="label">mint</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-mint110)"></div><div class="label">mint110</div></div>
    </div>
  </div>
  <div class="row" style="margin-bottom:10px;">
    <div class="name">aqua</div>
    <div class="group" style="margin:0; flex:1;">
      <div class="sw"><div class="chip" style="background:var(--oak-aqua30)"></div><div class="label">aqua30</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-aqua50)"></div><div class="label">aqua50</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-aqua)"></div><div class="label">aqua</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-aqua110)"></div><div class="label">aqua110</div></div>
    </div>
  </div>
  <div class="row" style="margin-bottom:10px;">
    <div class="name">lavender</div>
    <div class="group" style="margin:0; flex:1;">
      <div class="sw"><div class="chip" style="background:var(--oak-lavender30)"></div><div class="label">lav30</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-lavender50)"></div><div class="label">lav50</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-lavender)"></div><div class="label">lavender</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-lavender110)"></div><div class="label">lav110</div></div>
    </div>
  </div>
  <div class="row" style="margin-bottom:10px;">
    <div class="name">pink</div>
    <div class="group" style="margin:0; flex:1;">
      <div class="sw"><div class="chip" style="background:var(--oak-pink30)"></div><div class="label">pink30</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-pink50)"></div><div class="label">pink50</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-pink)"></div><div class="label">pink</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-pink110)"></div><div class="label">pink110</div></div>
    </div>
  </div>
  <div class="row" style="margin-bottom:10px;">
    <div class="name">lemon</div>
    <div class="group" style="margin:0; flex:1;">
      <div class="sw"><div class="chip" style="background:var(--oak-lemon30)"></div><div class="label">lemon30</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-lemon50)"></div><div class="label">lemon50</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-lemon)"></div><div class="label">lemon</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-lemon110)"></div><div class="label">lemon110</div></div>
    </div>
  </div>
  <div class="row">
    <div class="name">amber</div>
    <div class="group" style="margin:0; flex:1;">
      <div class="sw"><div class="chip" style="background:var(--oak-amber30)"></div><div class="label">amber30</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-amber50)"></div><div class="label">amber50</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-amber)"></div><div class="label">amber</div></div>
      <div class="sw"><div class="chip" style="background:var(--oak-amber)"></div><div class="label">amber</div></div>
    </div>
  </div>
</body></html>
