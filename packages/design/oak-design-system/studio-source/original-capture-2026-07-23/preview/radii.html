<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Border radii" subtitle="Square · xs · s · m · m2 · l · xl · circle" viewport="700x180" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px 24px; background:var(--bg-primary); font-family:var(--font-sans); }
  .row { display:flex; gap:20px; align-items:flex-end; justify-content:center; }
  .item { text-align:center; }
  .shape { width:72px; height:72px; background:var(--oak-mint); border:2px solid var(--border-primary); display:inline-block; }
  .name { margin-top:10px; font:700 12px/15px var(--font-sans); }
  .val { font:400 10px/13px var(--font-mono); color:var(--text-subdued); }
</style></head>
<body>
  <div class="row">
    <div class="item"><span class="shape" style="border-radius:0;"></span><div class="name">square</div><div class="val">0</div></div>
    <div class="item"><span class="shape" style="border-radius:2px;"></span><div class="name">xs</div><div class="val">2px</div></div>
    <div class="item"><span class="shape" style="border-radius:4px;"></span><div class="name">s</div><div class="val">4px</div></div>
    <div class="item"><span class="shape" style="border-radius:6px;"></span><div class="name">m</div><div class="val">6px</div></div>
    <div class="item"><span class="shape" style="border-radius:8px;"></span><div class="name">m2</div><div class="val">8px</div></div>
    <div class="item"><span class="shape" style="border-radius:16px;"></span><div class="name">l</div><div class="val">16px</div></div>
    <div class="item"><span class="shape" style="border-radius:24px;"></span><div class="name">xl</div><div class="val">24px</div></div>
    <div class="item"><span class="shape" style="border-radius:100px;"></span><div class="name">circle</div><div class="val">100px</div></div>
  </div>
</body></html>
