<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Oak National Academy — Oak UI Kit</title>
    <meta name="viewport" content="width=1280" />
    <link rel="stylesheet" href="../../colors_and_type.css" />
    <link rel="stylesheet" href="../../components.css" />
    <link rel="stylesheet" href="../../print.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg-primary);
        color: var(--text-primary);
      }
      * {
        box-sizing: border-box;
      }
      button,
      a,
      input {
        font-family: inherit;
      }
      .subject-collage {
        position: relative;
        min-height: 460px;
      }
      .subject-collage > .oak-card {
        position: absolute;
        width: 300px;
      }
      .scatter-1 {
        top: 12px;
        left: 48px;
        transform: rotate(-7deg);
      }
      .scatter-2 {
        top: 64px;
        left: 250px;
        transform: rotate(4.5deg);
      }
      .scatter-3 {
        top: 30px;
        left: 470px;
        transform: rotate(-2.8deg);
      }
      .scatter-4 {
        top: 150px;
        left: 130px;
        transform: rotate(9deg);
      }
      .scatter-5 {
        top: 190px;
        left: 390px;
        transform: rotate(-5.2deg);
      }
    </style>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="shared.js"></script>
    <script type="text/babel" src="sections.js"></script>
    <script type="text/babel">
      function App() {
        return (
          <div className="oak-scope oak-canvas" data-page="home">
            <div className="oak-region" data-region="masthead">
              <Nav active="Subjects" />
            </div>
            <main className="oak-main oak-region" data-region="main">
              <div className="oak-region" data-region="hero">
                <Hero />
                <TrustBand />
              </div>
              <div className="oak-region" data-region="featured">
                <h2 className="oak-heading-4" style={{ margin: 0 }}>
                  Explore our subjects
                </h2>
                <div className="subject-collage">
                  <div className="oak-card scatter-1">
                    <h3 className="oak-heading-6">Maths</h3>
                    <p className="oak-body-2">Number, algebra, geometry and more.</p>
                  </div>
                  <div className="oak-card scatter-2">
                    <h3 className="oak-heading-6">English</h3>
                    <p className="oak-body-2">Reading, writing and spoken language.</p>
                  </div>
                  <div className="oak-card scatter-3">
                    <h3 className="oak-heading-6">Science</h3>
                    <p className="oak-body-2">Biology, chemistry and physics.</p>
                  </div>
                  <div className="oak-card scatter-4">
                    <h3 className="oak-heading-6">History</h3>
                    <p className="oak-body-2">From ancient civilisations to today.</p>
                  </div>
                  <div className="oak-card scatter-5">
                    <h3 className="oak-heading-6">Geography</h3>
                    <p className="oak-body-2">Place, space and the environment.</p>
                  </div>
                </div>
              </div>
              <div className="oak-region" data-region="content">
                <AilaFeature />
                <CurriculumFeature />
                <PupilFeature />
              </div>
              <div className="oak-region" data-region="context">
                <QuoteBand />
              </div>
              <div className="oak-region" data-region="cta">
                <Newsletter />
              </div>
            </main>
            <div className="oak-region" data-region="footer">
              <Footer />
            </div>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
